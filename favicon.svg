<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradien Biru Terang Cerah (Bright Cyan to Electric Azure Blue) -->
    <linearGradient id="brightBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#00b4d8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Gradien Kilau Efek Kaca (Glass Gloss) -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Modern -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Square -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brightBlueGrad)" filter="url(#shadow)" />

  <!-- Inner Gloss Highlight -->
  <rect x="44" y="44" width="424" height="212" rx="100" fill="url(#glossGrad)" />

  <!-- Circular Radar / Pulse Accent Subtle Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Teks Inisial "Pro" -->
  <g filter="url(#textGlow)">
    <text x="256" y="308" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', Montserrat, sans-serif" 
          font-size="182" 
          font-weight="900" 
          letter-spacing="-4" 
          fill="#ffffff">
      Pro
    </text>
  </g>

  <!-- Aksen Titik Cyan Glow Terang di sudut atas -->
  <circle cx="395" cy="115" r="16" fill="#67e8f9" opacity="0.9" />
  <circle cx="395" cy="115" r="8" fill="#ffffff" />
</svg>
