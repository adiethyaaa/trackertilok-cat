name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Firebase Configuration
        uses: actions/github-script@v7
        env:
          RAW_SECRET: ${{ secrets.FIREBASE_CONFIG_JSON }}
        with:
          script: |
            const fs = require('fs');
            const raw = process.env.RAW_SECRET || '';
            let configObj = null;

            if (raw.trim()) {
              try {
                let cleaned = raw.trim();
                const match = cleaned.match(/\{[\s\S]*\}/);
                if (match) {
                  cleaned = match[0];
                }
                // Ekstrak objek JS bahkan jika formatnya const firebaseConfig = { ... }
                configObj = (new Function(`return ${cleaned};`))();
              } catch (err) {
                console.error("Evaluasi JS config gagal:", err.message);
                try {
                  configObj = JSON.parse(raw);
                } catch (e) {
                  console.error("JSON parse juga gagal:", e.message);
                }
              }
            }

            if (configObj && configObj.apiKey) {
              const fileContent = `window.__FIREBASE_CONFIG__ = ${JSON.stringify(configObj, null, 2)};\n`;
              fs.writeFileSync('js/firebaseConfig.js', fileContent, 'utf8');
              console.log("Firebase config successfully generated for project:", configObj.projectId);
            } else {
              fs.writeFileSync('js/firebaseConfig.js', 'window.__FIREBASE_CONFIG__ = null;\n', 'utf8');
              console.log("No valid Firebase config secret. Generated fallback null config.");
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
