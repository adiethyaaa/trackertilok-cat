name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Firebase Configuration from Secrets
        run: |
          if [ -n "${{ secrets.FIREBASE_CONFIG_JSON }}" ]; then
            echo "window.__FIREBASE_CONFIG__ = ${{ secrets.FIREBASE_CONFIG_JSON }};" > js/firebaseConfig.js
            echo "Firebase configuration successfully injected from GitHub Secrets."
          else
            echo "window.__FIREBASE_CONFIG__ = null;" > js/firebaseConfig.js
            echo "WARNING: FIREBASE_CONFIG_JSON secret not found. Running in offline/IndexedDB mode."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
